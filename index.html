يز المادة الطريقتين وتحيل كيفيات المشاركة الإلكترونية على نص تنظيمي."}, {"id": 359, "article": 639, "page": 173, "q": "تعذر الولوج للمنصة في آخر الأجل القانوني. ما الأثر؟", "options": [{"text": "لا تمديد لأي إجراء إلكتروني", "correct": false}, {"text": "يمدد إلى سنة تلقائيا", "correct": false}, {"text": "يسقط الحق رغم العطب المثبت", "correct": false}, {"text": "يمدد إلى أول يوم يلي استئناف خدماتها بصورة عادية", "correct": true}], "why": "تنشر الإدارة بلاغا يثبت العطب ومدته الزمنية."}, {"id": 360, "article": 640, "page": 174, "q": "ما ترتيب تطبيق الاتفاقيات الدولية المصادق عليها والمنشورة بالنسبة للقواعد المسطرية؟", "options": [{"text": "تطبق بالأسبقية على قواعد هذا القانون", "correct": true}, {"text": "تتساوى مع رسالة خاصة من أحد الأطراف", "correct": false}, {"text": "لا تطبق أمام المحاكم مطلقا", "correct": false}, {"text": "تطبق فقط بعد موافقة الخصم في كل قضية", "correct": false}], "why": "يشترط النص المصادقة والنشر بالجريدة الرسمية ويقرر أسبقية التطبيق."}]}];

function home(){clearInterval(clockId);active=null;app.innerHTML=`<section class="hero"><div><div class="eyebrow">بنك أسئلة • القانون رقم 58.25</div><h1>اقرأ القاعدة.<br>اختبر فهمك. ثبّت معرفتك.</h1><p class="lead">تدريب بالعربية على المسطرة المدنية، مع عناية بالتبليغ والتنفيذ والحجز. اختر جميع الأجوبة الصحيحة، ثم ارجع إلى شرح المادة ومصدرها.</p></div><div class="stats"><div class="stat"><b>${BANK.reduce((n,g)=>n+g.questions.length,0)}</b><span>سؤال اختيار متعدد</span></div><div class="stat"><b>${BANK.length}</b><span>سلاسل موضوعية</span></div><div class="stat"><b>30</b><span>سؤالًا لكل سلسلة</span></div></div></section><div class="note"><strong>طريقة التنقيط:</strong> لكل سؤال جواب صحيح واحد أو جوابان أو ثلاثة من أصل أربعة. تُمنح نقطة فقط عند اختيار جميع الأجوبة الصحيحة دون أي اختيار خاطئ؛ لا خصم للنقط. اختر إجاباتك ثم اضغط «تأكيد الإجابة» لعرض الشرح في التدريب. في الامتحان يظهر التصحيح بعد التسليم.</div><div class="controls"><label for="mode">طريقة العمل</label><select id="mode"><option value="practice">تدريب — تصحيح فوري</option><option value="exam">امتحان — تصحيح في النهاية</option></select><span class="subtle">كل وضع يحفظ تقدمه بصورة مستقلة.</span></div><div class="cards">${BANK.map((g,i)=>{const s=saved.sessions[i+'-'+saved.mode],done=s?Object.keys(s.checked).length:0,best=saved.best[i+'-'+saved.mode];return `<article class="card"><div class="num">السلسلة ${String(i+1).padStart(2,'0')} ${i>=6?'<span class="pill">جديدة</span>':''}</div><h2>${esc(g.title)}</h2><div class="meta">30 سؤالًا · من إجابة إلى ثلاث إجابات صحيحة</div><div class="bar"><i style="width:${done/30*100}%"></i></div><div class="subtle">${done} / 30 ${saved.mode==='exam'?'إجابة محفوظة':'سؤالًا مصححًا'}${best!=null?' · أفضل نتيجة: '+best+'/30':''}</div><button class="btn primary" data-start="${i}">${s&&!s.finished?'متابعة السلسلة':s?.finished?'عرض النتيجة':'ابدأ السلسلة'} ←</button></article>`}).join('')}</div><p class="subtle" id="storage">${storageOK?'يحفظ التقدم في هذا المتصفح على جهازك.':'تعذر الحفظ المحلي؛ يمكنك التدريب، لكن التقدم قد لا يبقى بعد الإغلاق.'}</p><button class="btn small" id="resetAll">مسح التقدم المحفوظ</button>${footer()}`;
document.getElementById('mode').value=saved.mode;document.getElementById('mode').onchange=e=>{saved.mode=e.target.value;persist();home()};document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(+b.dataset.start));document.getElementById('resetAll').onclick=()=>{if(confirm('هل تريد مسح كل الإجابات والنتائج المحفوظة على هذا المتصفح؟')){saved={sessions:{},best:{},mode:saved.mode};persist();home()}}}
function start(g,fresh=false){const key=g+'-'+saved.mode;if(fresh||!saved.sessions[key])saved.sessions[key]={answers:{},checked:{},finished:false,elapsed:0,index:0};active={g,key,mode:saved.mode,s:saved.sessions[key],ids:BANK[g].questions.map((_,i)=>i)};idx=active.s.index||0;persist();if(active.s.finished){result();return}render();clearInterval(clockId);clockId=setInterval(()=>{if(active&&!active.s.finished){active.s.elapsed++;const t=document.getElementById('timer');if(t)t.textContent=time(active.s.elapsed);if(active.s.elapsed%5===0)persist()}},1000)}
function time(s){return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0')}

function selected(q){return active.s.answers[q.id]||[]}
function correct(q){const a=selected(q),b=q.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0);return a.length===b.length&&a.every(i=>b.includes(i))}
function render(){let q=question(),locked=active.mode==='practice'&&active.s.checked[q.id],done=active.ids.filter(i=>active.s.checked[BANK[active.g].questions[i].id]).length;active.s.index=idx;persist();app.innerHTML=`<div class="topline"><div><div class="eyebrow">السلسلة ${String(active.g+1).padStart(2,'0')} / ${active.mode==='exam'?'محاكاة امتحان':'تدريب مع التصحيح'}</div><h2>${esc(BANK[active.g].title)}</h2></div><button class="btn small" id="backHome">حفظ والعودة للسلاسل</button></div><div class="layout"><section class="question"><span class="pill">السؤال ${idx+1} من ${active.ids.length}</span> <span class="subtle">اختر كل ما يصح · 1 إلى 3 أجوبة</span><h2 id="qtitle">${esc(q.q)}</h2><div role="group" aria-labelledby="qtitle">${q.options.map((o,i)=>`<label class="choice ${locked?(o.correct?'good':selected(q).includes(i)?'bad':''):''}"><input type="checkbox" value="${i}" ${selected(q).includes(i)?'checked':''} ${locked?'disabled':''}><span class="letter">${'أبجد'[i]}</span><span>${esc(o.text)}${locked&&o.correct?' <strong>✓ صحيح</strong>':''}${locked&&!o.correct&&selected(q).includes(i)?' <strong>✕ خاطئ</strong>':''}</span></label>`).join('')}</div><div class="status" id="status" role="status"></div><div class="actions"><button class="btn primary" id="check">${locked?'عرض الشرح مجددًا':active.mode==='exam'?'حفظ الإجابة':'تأكيد الإجابة'}</button><div><button class="btn" id="prev" ${idx===0?'disabled':''}>السابق</button> <button class="btn" id="next" ${idx===active.ids.length-1?'disabled':''}>التالي ←</button></div></div></section><aside class="navigator"><div class="eyebrow">الوقت المستغرق • بلا حد زمني</div><div class="timer" id="timer">${time(active.s.elapsed)}</div><p class="subtle">تم ${active.mode==='exam'?'حفظ':'تصحيح'} ${done} من ${active.ids.length}</p><div class="grid">${active.ids.map((n,i)=>`<button aria-label="السؤال ${i+1}" ${idx===i?'aria-current="step"':''} data-jump="${i}" class="${active.s.checked[BANK[active.g].questions[n].id]?'done':''} ${idx===i?'current':''}">${i+1}</button>`).join('')}</div><p class="subtle">الأخضر: ${active.mode==='exam'?'محفوظ':'مصحح'} · الإطار: السؤال الحالي</p><button class="btn primary" id="finish">إنهاء السلسلة وعرض النتيجة</button></aside></div>${footer()}`;
document.getElementById('backHome').onclick=()=>{persist();home()};document.querySelectorAll('input[type=checkbox]').forEach(b=>b.onchange=()=>{const a=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>+x.value);active.s.answers[q.id]=a;if(active.mode==='exam')delete active.s.checked[q.id];persist();document.getElementById('status').textContent=a.length>3?'يمكن أن تكون ثلاثة اختيارات صحيحة كحد أقصى.':''});document.getElementById('check').onclick=()=>{if(locked){feedback(q);return}if(!selected(q).length||selected(q).length>3){document.getElementById('status').textContent='اختر من جواب واحد إلى ثلاثة أجوبة، ثم أكد الإجابة.';return}active.s.checked[q.id]=true;persist();render();if(active.mode==='practice')feedback(q);else document.getElementById('status').textContent='تم حفظ الإجابة. يمكنك تعديلها قبل التسليم.'};document.getElementById('prev').onclick=()=>{idx--;render()};document.getElementById('next').onclick=()=>{idx++;render()};document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{idx=+b.dataset.jump;render()});document.getElementById('finish').onclick=finish;}
function feedback(q){const ok=!!active.s.checked[q.id]&&correct(q);document.getElementById('feedbackTitle').textContent=ok?'إجابة صحيحة ✓':'راجع اختياراتك';document.getElementById('modalBody').innerHTML=`<p><strong>${esc(q.q)}</strong></p><p class="subtle">${ok?'اخترت جميع الأجوبة الصحيحة دون إضافة اختيار خاطئ.':'لا تمنح النقطة إلا بمطابقة مجموعة الأجوبة الصحيحة كاملة.'}</p>${q.options.map((o,i)=>`<div class="answerline ${o.correct?'':'badline'}"><strong>${o.correct?'✓ صحيح':'✕ غير صحيح'}</strong> · ${esc(o.text)} ${selected(q).includes(i)?'<small>— اختيارك</small>':''}${o.correct&&!selected(q).includes(i)?'<small>— لم تختره</small>':''}</div>`).join('')}<h3>لماذا؟</h3><div class="explain">${esc(q.why)}</div><p class="reference">المرجع: المادة ${q.article} من القانون رقم 58.25 · صفحة PDF رقم ${q.page} (الصفحة المطبوعة ${q.page-1}). الشرح أعلاه صياغة تعليمية لمضمون المادة.</p><button class="btn" id="openRef">قراءة المادة في الوثيقة الأصلية ↗</button><button class="btn primary" id="understood" style="margin-right:8px">فهمت، إغلاق</button>`;document.getElementById('openRef').onclick=()=>source(q.page);document.getElementById('understood').onclick=()=>dialog.close();dialog.showModal()}
function finish(){const missing=active.ids.filter(i=>!active.s.checked[BANK[active.g].questions[i].id]).length;if(missing&&!confirm('بقي '+missing+' سؤالًا دون تأكيد أو حفظ. هل تريد إنهاء السلسلة؟ تحتسب الأسئلة غير المؤكدة بصفر.'))return;active.s.finished=true;clearInterval(clockId);const score=active.ids.filter(i=>{const q=BANK[active.g].questions[i];return active.s.checked[q.id]&&correct(q)}).length;if(active.ids.length===30)saved.best[active.key]=Math.max(saved.best[active.key]||0,score);persist();result()}
function result(){clearInterval(clockId);let qs=active.ids.map(i=>BANK[active.g].questions[i]),score=qs.filter(q=>active.s.checked[q.id]&&correct(q)).length,wrong=qs.filter(q=>!active.s.checked[q.id]||!correct(q)),unanswered=qs.filter(q=>!active.s.checked[q.id]).length;app.innerHTML=`<section class="result"><div class="eyebrow">حصيلة السلسلة ${String(active.g+1).padStart(2,'0')}</div><h1>${esc(BANK[active.g].title)}</h1><div class="summary"><div class="score">${score}<span style="font-size:25px;color:var(--muted)"> / ${qs.length}</span></div><p>${Math.round(score/qs.length*100)}% إجابات مكتملة وصحيحة · الوقت: <b dir="ltr">${time(active.s.elapsed)}</b></p><p class="subtle">${wrong.length-unanswered} إجابة غير صحيحة · ${unanswered} دون تأكيد · نقطة واحدة للمطابقة الكاملة، دون نقط جزئية.</p><div class="controls"><button class="btn primary" id="retry">إعادة السلسلة</button><button class="btn" id="home">السلاسل</button><button class="btn" id="wrongOnly">عرض الأخطاء فقط</button></div></div><h2>التصحيح والمراجع</h2><div id="review">${qs.map(q=>`<div class="reviewitem" data-wrong="${!active.s.checked[q.id]||!correct(q)}"><button class="btn" data-review="${q.id}">${active.s.checked[q.id]&&correct(q)?'✓':'○'} ${esc(q.q)}<br><span class="subtle">المادة ${q.article} · ${active.s.checked[q.id]?(correct(q)?'صحيح':'يحتاج مراجعة'):'غير مؤكد'} · اضغط للشرح</span></button></div>`).join('')}</div>${footer()}</section>`;document.getElementById('home').onclick=home;document.getElementById('retry').onclick=()=>{if(confirm('هل تريد بدء محاولة جديدة لهذه السلسلة؟ ستستبدل إجاباتها مع الاحتفاظ بأفضل نتيجة.'))start(active.g,true)};let only=false;document.getElementById('wrongOnly').onclick=e=>{only=!only;document.querySelectorAll('[data-wrong]').forEach(el=>el.classList.toggle('hidden',only&&el.dataset.wrong==='false'));e.target.textContent=only?'عرض جميع الأسئلة':'عرض الأخطاء فقط'};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const q=qs.find(q=>q.id===+b.dataset.review);feedback(q)});window.scrollTo(0,0)}
window.addEventListener('pagehide',persist);home();
</script></body></html>
